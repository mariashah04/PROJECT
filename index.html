<!DOCTYPE html>
<html>

<head>
    <title>Digital Mentor Dairy</title>

    <link rel="stylesheet" href="others/style.css">
    <script src="others/menu.js"></script>

<body>
    <div class="container">
        <div class="card">
            <img class="logo" src="others/images/logo.png" alt="">
            <h2>Login</h2>
            <form>
                <input type="text" id="email" name="email" placeholder="Email ID" required>
                <input type="password" id="password" name="password" placeholder="Password" required>
                <button type="submit"><a onclick="redirect('dashboard')">Login</a></button>
            </form>
            <div class="signup">
                <b>Don't have account?</b>
                <a onclick="redirect('registration')">Sign up</a>
            </div>
        </div>
    </div>
